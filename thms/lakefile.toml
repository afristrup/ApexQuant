name = "thms"
version = "0.1.0"
keywords = ["math", "quantisation"]
defaultTargets = ["Contributions"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "Contributions"
srcDir = "."
roots = ["contributions"]
